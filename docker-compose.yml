# Local stack: `docker compose up --build`  →  API http://localhost:8000/docs · Admin http://localhost:5173
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buildcrew
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/buildcrew
      LOCAL_STORAGE_DIR: /app/var/storage
    volumes: [media:/app/var/storage]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  admin:
    build:
      context: ./admin
      args: { VITE_API_BASE_URL: "http://localhost:8000" }
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
  media:
