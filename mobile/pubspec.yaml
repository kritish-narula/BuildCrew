name: buildcrew
description: BuildCrew — hyperlocal construction labour marketplace (worker + customer app).
publish_to: "none"
# versionName comes from here; versionCode (build number) is set by CI from the run number,
# so every release is strictly higher and installs as an UPDATE over the previous one.
version: 0.4.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^14.6.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  flutter_tts: ^4.2.0
  flutter_local_notifications: ^18.0.1
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  crypto: ^3.0.6
  # media / device
  just_audio: ">=0.9.40 <0.11.0"
  record: ">=5.1.0 <7.0.0"
  image_picker: ^1.1.2
  geolocator: ">=13.0.0 <15.0.0"
  speech_to_text: ">=7.0.0 <8.0.0"
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  # maps & addresses (OpenStreetMap tiles: no API key; Android's built-in geocoder)
  flutter_map: ">=7.0.0 <9.0.0"
  latlong2: ^0.9.1
  geocoding: ">=3.0.0 <5.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/
  fonts:
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
        - asset: assets/fonts/Mukta-ExtraBold.ttf
          weight: 800
