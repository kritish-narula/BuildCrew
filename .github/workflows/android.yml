name: Android build & release

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' }}
      TAG: v0-b${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate + harden Android project
        run: |
          flutter --version
          python3 tool/prepare_android.py

      - name: Dependencies & localisation
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Analyze & test
        run: |
          # Surface compiler/analyzer errors as annotations (visible without log access).
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze.txt 2>&1 \
            || { grep -E "error" /tmp/analyze.txt | head -40 | sed -E 's/^\s*/::error::/'; cat /tmp/analyze.txt; exit 1; }
          flutter test > /tmp/test.txt 2>&1 \
            || { grep -E "Error|error:|Expected|FAILED" /tmp/test.txt | head -40 | sed -E 's/^\s*/::error::/'; cat /tmp/test.txt; exit 1; }

      - name: Install release signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=buildcrew"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Build APKs (split per CPU type — ~half the download size)
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          echo "TAG=v${VERSION}-b${{ github.run_number }}" >> "$GITHUB_ENV"
          flutter build apk --release --split-per-abi --tree-shake-icons \
            --build-name="$VERSION" --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} \
            --dart-define=UPDATE_MANIFEST_URL=https://github.com/${{ github.repository }}/releases/latest/download/update.json \
            > /tmp/build.txt 2>&1 \
            || { grep -E "error:|Error:|What went wrong|e: |FAILURE|Exception" -A2 /tmp/build.txt | head -40 | sed -E 's/^\s*/::error::/'; cat /tmp/build.txt; exit 1; }
          tail -5 /tmp/build.txt
          # Universal APK for first-time installs from the release page (one file for every phone).
          # versionCode 2000+run: same as this run's arm64 build and below the next run's, so a
          # phone can move between the universal and per-CPU APKs without a "downgrade" error.
          flutter build apk --release --tree-shake-icons \
            --build-name="$VERSION" --build-number=$((2000 + ${{ github.run_number }})) \
            --obfuscate --split-debug-info=build/symbols-universal \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} \
            --dart-define=UPDATE_MANIFEST_URL=https://github.com/${{ github.repository }}/releases/latest/download/update.json \
            > /tmp/build2.txt 2>&1 || { tail -40 /tmp/build2.txt | sed -E 's/^\s*/::error::/'; exit 1; }

      - name: APK size budget (low-end phones, 2G/3G downloads)
        run: |
          # Prints every APK size as a notice and FAILS if the universal APK is over 45 MB.
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            b=$(stat -c%s "$f")
            echo "::notice title=APK size::$(basename "$f") = $(awk "BEGIN{printf \"%.1f\", $b/1048576}") MB"
          done
          U=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)
          if [ "$U" -gt $((45 * 1048576)) ]; then
            echo "::error::Universal APK is $(awk "BEGIN{printf \"%.1f\", $U/1048576}") MB, over the 45 MB budget. Check new packages / assets."
            exit 1
          fi

      - name: Verify signature is the permanent release key
        if: env.HAS_KEY == 'true'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | tee /tmp/cert.txt
          grep -qi "e0c41cb01d086d1b08ce6bf48ffb1c22a4676a1131008bd6e7f5789ef969cfb1" /tmp/cert.txt \
            || (echo "::error::APK not signed with the BuildCrew release key — updates would fail" && exit 1)

      - name: Package release + update manifest
        run: python3 tool/make_release.py "${{ github.repository }}" "${{ github.run_number }}" "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: BuildCrew-apks
          path: mobile/dist/
          if-no-files-found: error

      - name: Publish GitHub Release (app picks this up as an update)
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ls -la dist/
          # Hidden helper release: small per-CPU APKs the in-app updater downloads.
          gh release create "$TAG-cpu" dist/BuildCrew-*.apk --target "$GITHUB_SHA" \
            --title "Update files for ${TAG#v} (used by the app — not for manual download)" \
            --notes "Downloaded automatically by the app's updater. To install, use the latest release." \
            --prerelease --latest=false 2>&1 | tee /tmp/gh1.txt || { sed -E 's/^/::error::/' /tmp/gh1.txt; exit 1; }
          # Public release: one file to download + the update manifest.
          gh release create "$TAG" dist/BuildCrew.apk dist/update.json \
            --target "$GITHUB_SHA" --title "BuildCrew ${TAG#v}" --notes-file dist/notes.md --latest 2>&1 | tee /tmp/gh2.txt || { sed -E 's/^/::error::/' /tmp/gh2.txt; exit 1; }

      - name: Signing key missing
        if: env.HAS_KEY != 'true'
        run: echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets not set — built APKs as an artifact only, no release published."
