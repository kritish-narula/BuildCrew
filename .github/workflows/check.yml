name: Mobile check (dev)

on:
  push:
    branches: [dev]
    paths: ["mobile/**", ".github/workflows/check.yml"]

permissions:
  contents: write # publish the screenshots to the `ci-screens` release

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: python3 tool/prepare_android.py
      - name: Dependencies & localisation
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze.txt 2>&1 \
            || { grep -E "error" /tmp/analyze.txt | head -60 | sed -E 's/^\s*/::error::/'; cat /tmp/analyze.txt; exit 1; }
          grep -E "warning" /tmp/analyze.txt | head -30 | sed -E 's/^\s*/::warning::/' || true
      - name: Test
        run: |
          flutter test --reporter expanded > /tmp/test.txt 2>&1 \
            || { grep -A10 "\[E\]" /tmp/test.txt | cut -c1-300 | head -60 | sed -E 's/^\s*/::error::/'; grep -E "Which:|Bad state|^  - |Error|error:|Expected|Actual|FAILED|overflowed|Exception|RENDER OVERFLOW|OTHER FLUTTER ERRORS|COULD NOT BE CAPTURED" /tmp/test.txt | cut -c1-400 | head -90 | sed -E 's/^\s*/::error::/'; tail -200 /tmp/test.txt; exit 1; }
          tail -3 /tmp/test.txt
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: mobile/test/screens_out/
          if-no-files-found: ignore
      - name: Publish screenshots to release ci-screens
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          pngs=(test/screens_out/*.png)
          if [ ${#pngs[@]} -eq 0 ]; then
            echo "no screenshots produced, skipping release"
            exit 0
          fi
          zip -q -j /tmp/screens.zip "${pngs[@]}"
          cp /tmp/test.txt /tmp/test-log.txt 2>/dev/null || echo "no log" > /tmp/test-log.txt
          gh release delete ci-screens --yes --cleanup-tag || true
          gh release create ci-screens /tmp/screens.zip /tmp/test-log.txt \
            --target "${{ github.sha }}" --prerelease --latest=false \
            --title "CI screenshots" --notes "auto"
